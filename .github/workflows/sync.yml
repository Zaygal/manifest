name: sync

# Keeps the published site in step with contracts/. Pages is served from /docs on
# the branch (build_type: legacy), which does not need an Actions runner to
# publish - worth knowing, because a degraded-runner incident took the
# Actions-based Pages deploy out and the site had to keep working.

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync

jobs:
  sync:
    name: regenerate what the site serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1

      - name: rebuild the ABI and the initcode
        working-directory: contracts
        run: |
          mkdir -p ../docs/build
          # --json matters: without it, and on current Foundry, `forge inspect abi`
          # pretty-prints a human-readable table of signatures and selectors. That
          # table then gets served as abi.json and every fetch in the browser fails
          # to parse it, silently, because the page catches the error and behaves
          # as though no ABI were published at all.
          forge inspect src/Manifest.sol:Manifest abi --json > ../docs/build/abi.json
          forge inspect src/Manifest.sol:Manifest bytecode > ../docs/build/bytecode.txt

      # The guard that would have caught the above before it reached the site.
      - name: refuse to publish anything the browser cannot parse
        working-directory: contracts
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          abi = pathlib.Path('../docs/build/abi.json')
          try:
              parsed = json.loads(abi.read_text())
          except Exception as exc:
              sys.exit('abi.json is not valid JSON, so the site would silently break: %s' % exc)
          if not isinstance(parsed, list) or not parsed:
              sys.exit('abi.json parsed but is not a non-empty ABI array')
          names = [e.get('name') for e in parsed if e.get('type') in ('function', 'event')]
          for needed in ('pay', 'Paid', 'Batch'):
              if needed not in names:
                  sys.exit('abi.json is missing %s' % needed)
          print('abi.json is valid: %d entries, includes pay/Paid/Batch' % len(parsed))

          bc = pathlib.Path('../docs/build/bytecode.txt').read_text().strip()
          if not bc.startswith('0x') or len(bc) < 100:
              sys.exit('bytecode.txt does not look like deployment code')
          print('bytecode.txt is valid: %d bytes of initcode' % ((len(bc) - 2) // 2))
          PY

      - name: commit them back if the contract changed
        run: |
          git config user.name  "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add docs/build/abi.json docs/build/bytecode.txt
          if git diff --cached --quiet; then
            echo "already in sync with the committed contract"
          else
            git commit -m "build: regenerate the published ABI and initcode from contracts/"
            git push
          fi
