[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.24"
optimizer = true
# 1, not 200. optimizer_runs trades deploy size against runtime gas per call, and
# for this contract deploy size is what binds: the runtime is ~1.8 kB, and code
# deposit costs 200 gas per byte, so the deployment is dominated by its own size
# rather than by constructor work. Optimising for size is a deliberate choice for
# a contract that gets deployed once and called a handful of times by a payer
# whose entire balance is a few cents.
optimizer_runs = 1
